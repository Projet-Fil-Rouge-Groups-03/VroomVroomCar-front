<div class="carousel" *ngIf="cars.length > 0; else empty">
  <div class="carousel__track-wrapper">
    <button class="carousel__nav carousel__nav--prev" (click)="prev()" [disabled]="!canPrev" aria-label="Précédent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="carousel__track">
      <app-company-car-card
        *ngFor="let car of visibleCars"
        [car]="car"
        (cardClicked)="onCardClicked($event)"
        class="carousel__item"
      ></app-company-car-card>
    </div>

    <button class="carousel__nav carousel__nav--next" (click)="next()" [disabled]="!canNext" aria-label="Suivant">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

  <div class="carousel__dots" *ngIf="cars.length > visibleCount">
    <button
      *ngFor="let _ of [].constructor(totalPages); let i = index"
      class="carousel__dot"
      [class.carousel__dot--active]="i === currentIndex"
      (click)="goTo(i)"
      [attr.aria-label]="'Page ' + (i + 1)"
    ></button>
  </div>
</div>

<ng-template #empty>
  <div class="carousel__empty">
    <span>🚗</span>
    <p>Aucun véhicule ne correspond à vos critères.</p>
  </div>
</ng-template>
